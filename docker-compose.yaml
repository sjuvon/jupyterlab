# Parsed using .env file:

version: '${APP_VERSION}'
services:
  jupyter:
    image: '${APP_NAME}:${APP_VERSION}'
    build:
      context: '${HOST_BUILD_CONTEXT}'
      args:
        APP_PORT: '${APP_PORT}'
        APP_USER: '${APP_USER}'
        APP_HOME: '${APP_HOME}'
    container_name: '${APP_CONTAINER_NAME}'
    user: '${APP_USER}'
    volumes:
      - '${HOST_HOME}:${APP_HOME}'
    ports:
      - '${HOST_PORT}:${APP_PORT}'
    restart: '${APP_RESTART}'
    command: '${APP_COMMAND}'
    healthcheck:
      test: '${APP_HEALTHCHECK_TEST}'
      interval: '${APP_HEALTHCHECK_INTERVAL}'
      timeout: '${APP_HEALTHCHECK_TIMEOUT}'
      retries: ${APP_HEALTHCHECK_RETRIES}